<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NetSketch · 网络拓扑工作台</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><div class="brand"><span class="brand-icon">⌘</span> NetSketch <small>网络拓扑工作台</small></div><div class="file-actions"><button id="newProject">新建</button><button id="openProject">打开项目</button><button id="saveProject" class="primary">保存到本地</button><button id="exportSvg">导出 SVG</button><button id="exportPng">导出 PNG</button></div></header>
<main><aside class="library"><div class="eyebrow">DEVICE LIBRARY</div><h2>设备库 <span id="libraryCount">20</span></h2><p class="muted">拖入画布，开始构建你的网络</p><input id="deviceSearch" type="search" placeholder="搜索设备名称 / NVR / ONT" aria-label="搜索设备"><div id="deviceLibrary"></div><section class="library-note"><span>✦</span><strong>从端口到端口</strong><p>选择连线工具，依次点击两台设备，指定两端端口即可连接。</p></section><button id="loadDemo" class="wide">载入示例拓扑</button><div class="privacy">◉  本地工作空间<br><small>项目数据仅保存在当前浏览器和本地文件中</small></div></aside>
<section class="workspace"><div class="project-bar"><div><input id="projectName" aria-label="项目名称" value="未命名拓扑"><span id="saveStatus">本地草稿</span></div><span id="counts"></span></div><div class="canvas-toolbar"><div class="tool-group"><button id="selectTool" class="active" title="选择工具 (V)">↖ <span>选择</span></button><button id="connectTool" title="连线工具 (C)">⌁ <span>连线</span></button></div><div class="separator"></div><button id="undo" title="撤销 Ctrl+Z">↶</button><button id="redo" title="重做 Ctrl+Shift+Z">↷</button><button id="delete" title="删除选中项 Delete">删除</button><div class="toolbar-spacer"></div><span class="hint">空格拖动画布 · 滚轮缩放</span><button id="fit">适应画布</button></div><div id="canvas" tabindex="0"><div id="world"><svg id="edges"></svg><div id="nodes"></div></div><div id="empty"><div class="empty-symbol">⌘</div><h2>让你的网络，一目了然</h2><p>从左侧拖入第一台设备，或载入示例开始探索。</p><button id="emptyDemo" class="primary">探索示例拓扑 →</button></div><div id="marquee"></div><div id="modeNotice"></div><div class="legend" id="legend"></div><div class="zoom-control"><button id="zoomOut">−</button><span id="zoomValue">100%</span><button id="zoomIn">＋</button><button id="resetZoom" title="重置视图">◎</button></div></div><footer><span id="footerMessage">就绪 · 拖入设备，或双击设备库添加</span><span>NETSKETCH / LOCAL FIRST</span></footer></section>
<aside class="inspector"><div class="eyebrow">PROPERTIES</div><h2 id="inspectorTitle">属性面板</h2><div id="inspectorBody"></div></aside></main>
<dialog id="connectionDialog"><form id="connectionForm"><div class="eyebrow">NEW CONNECTION</div><h2>连接设备端口</h2><div id="connectionFields"></div><label>线材类型<select id="connectionCable"></select></label><p class="muted">已占用的端口不可重复连接。</p><div class="dialog-actions"><button type="button" id="cancelConnection">取消</button><button class="primary" type="submit">建立连接</button></div></form></dialog><input type="file" id="fileInput" accept=".json,.netsketch" hidden><div id="toast" role="status"></div><script src="label-layout.js"></script><script src="app.js"></script></body></html>
