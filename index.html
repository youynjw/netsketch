<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NetSketch · 网络拓扑工作台</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="shared-header.css"></head>
<body>
<header class="app-header unified-header"><a class="brand" href="index.html"><span class="network-logo" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 8h8M12 24h8M8 12v8M24 12v8"/><rect x="4" y="4" width="8" height="8" rx="2"/><rect x="20" y="4" width="8" height="8" rx="2"/><rect x="4" y="20" width="8" height="8" rx="2"/><rect x="20" y="20" width="8" height="8" rx="2"/></svg></span> NetSketch</a><nav aria-label="工作页面"><a href="index.html" class="current" aria-current="page">网络拓扑</a><a href="racks.html">机柜管理</a></nav><div class="header-actions"><button id="newProject">新建</button><button id="openProject">打开项目</button><button id="saveProject" class="primary">保存到本地</button><button id="exportSvg">导出 SVG</button><button id="exportPng">导出 PNG</button></div></header>
<main><aside class="library"><button class="panel-toggle" id="toggleLibrary" aria-expanded="true" aria-controls="libraryPanel" title="收起设备库" aria-label="收起设备库">‹</button><div class="panel-content" id="libraryPanel"><div class="eyebrow">DEVICE LIBRARY</div><h2>设备库 <span id="libraryCount">20</span></h2><p class="muted">拖入画布，开始构建你的网络</p><input id="deviceSearch" type="search" placeholder="搜索设备名称 / NVR / ONT" aria-label="搜索设备"><div id="deviceLibrary"></div><section class="library-note"><span>✦</span><strong>从端口到端口</strong><p>选择连线工具，依次点击两台设备，指定两端端口即可连接。</p></section><button id="loadDemo" class="wide">载入示例拓扑</button><div class="privacy">◉  本地工作空间<br><small>项目数据仅保存在当前浏览器和本地文件中</small></div></div></aside>
<section class="workspace"><div class="project-bar"><div><input id="projectName" aria-label="项目名称" value="未命名拓扑"><span id="saveStatus">本地草稿</span></div><span id="counts"></span></div><div class="canvas-toolbar"><div class="tool-group"><button id="selectTool" class="active" title="选择工具 (V)">↖ <span>选择</span></button><button id="panTool" title="平移工具：按住鼠标左键拖动画布">✥ <span>平移</span></button><button id="connectTool" title="连线工具 (C)">⌁ <span>连线</span></button></div><div class="separator"></div><button id="undo" title="撤销 Ctrl+Z">↶</button><button id="redo" title="重做 Ctrl+Shift+Z">↷</button><button id="copy" title="复制选中设备或标注">复制</button><button id="delete" title="删除选中项 Delete">删除</button><div class="toolbar-spacer"></div><span class="hint">空格平移 · 滚轮缩放 · 20px 网格吸附</span><button id="fit">适应画布</button><button id="fullscreen" aria-pressed="false" title="全屏画布">⛶ 全屏</button></div><div id="canvas" tabindex="0"><div id="world"><div id="regions"></div><svg id="edges"></svg><div id="nodes"></div></div><div id="empty"><div class="empty-symbol">⌘</div><h2>让你的网络，一目了然</h2><p>从左侧拖入第一台设备，或载入示例开始探索。</p><button id="emptyDemo" class="primary">探索示例拓扑 →</button></div><div class="canvas-nav" aria-label="画布方向移动"><button class="nav-left" data-pan-x="1" data-pan-y="0" aria-label="向左查看画布" title="向左查看（可按住）">◀</button><button class="nav-right" data-pan-x="-1" data-pan-y="0" aria-label="向右查看画布" title="向右查看（可按住）">▶</button><button class="nav-up" data-pan-x="0" data-pan-y="1" aria-label="向上查看画布" title="向上查看（可按住）">▲</button><button class="nav-down" data-pan-x="0" data-pan-y="-1" aria-label="向下查看画布" title="向下查看（可按住）">▼</button></div><div id="marquee"></div><div id="modeNotice"></div><div class="legend" id="legend"></div><div class="zoom-control"><button id="zoomOut">−</button><span id="zoomValue">100%</span><button id="zoomIn">＋</button><button id="resetZoom" title="重置视图">◎</button></div></div><footer><span id="footerMessage">就绪 · 拖入设备，或双击设备库添加</span><span>NETSKETCH / LOCAL FIRST</span></footer></section>
<aside class="inspector"><button class="panel-toggle" id="toggleInspector" aria-expanded="true" aria-controls="inspectorPanel" title="收起属性栏" aria-label="收起属性栏">›</button><div class="panel-content" id="inspectorPanel"><div class="eyebrow">PROPERTIES</div><h2 id="inspectorTitle">属性面板</h2><div id="inspectorBody"></div></div></aside></main>
<dialog id="connectionDialog"><form id="connectionForm"><div class="eyebrow">NEW CONNECTION</div><h2>连接设备端口</h2><div id="connectionFields"></div><label>线材类型<select id="connectionCable"></select></label><label>带宽<input id="connectionBandwidth" list="bandwidthOptions" maxlength="80" placeholder="选填，如 1 Gbps"></label><label><input id="connectionShowBandwidth" type="checkbox">在主图显示带宽</label><p class="muted">已占用的端口不可重复连接。</p><div class="dialog-actions"><button type="button" id="cancelConnection">取消</button><button class="primary" type="submit">建立连接</button></div></form></dialog><datalist id="bandwidthOptions"><option value="10 Mbps"><option value="100 Mbps"><option value="1 Gbps"><option value="2.5 Gbps"><option value="5 Gbps"><option value="10 Gbps"><option value="25 Gbps"><option value="40 Gbps"><option value="100 Gbps"></datalist><input type="file" id="fileInput" accept=".json,.netsketch" hidden><div id="toast" role="status"></div><script src="label-layout.js"></script><script src="app.js"></script></body></html>
